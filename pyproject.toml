[project]
name = "lobmm"
version = "0.1.0"
description = "Signal-aware market making on crypto limit order books: book rebuild, short-horizon signals, and an event-driven backtester."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rameshwar Shinde" }]
dependencies = [
    "tardis-dev>=2.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "numba>=0.60",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
]

[project.scripts]
lobmm = "lobmm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lobmm"]
